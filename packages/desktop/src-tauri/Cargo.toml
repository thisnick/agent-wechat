[package]
name = "agent-wechat-desktop"
version = "1.0.1"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "agent-wechat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.7"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "rt-multi-thread", "fs", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
anyhow = "1"
rand = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
sha2 = "0.10"
zeroize = "1"
rcgen = "0.14"
tempfile = "3"
tokio-util = { version = "0.7", features = ["io", "rt"] }
wechat-platform = { path = "../../native-client-rust/crates/wechat-platform" }
tauri-plugin-updater = "2.14"
semver = "1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
winreg = "0.55"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
notify-rust = "4.18"

