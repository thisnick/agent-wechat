[package]
name = "wechat-simulator"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "wx-dev"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "io-util"] }
rusqlite.workspace = true
sha2.workspace = true
subtle = "2"
fs2.workspace = true
image = { version = "0.25", default-features = false, features = ["png"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
wechat-profile = { path = "../wechat-profile" }
wechat-core = { path = "../wechat-core" }
wechat-api = { path = "../wechat-api" }
wechat-store = { path = "../wechat-store" }
wechat-protocol = { path = "../wechat-protocol" }
wechat-platform = { path = "../wechat-platform" }
qrcodegen = "1.8.0"
base64.workspace = true
uuid.workspace = true

[dev-dependencies]
rqrr = { version = "0.11.0", default-features = false }
