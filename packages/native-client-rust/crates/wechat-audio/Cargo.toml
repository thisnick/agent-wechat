[package]
name = "wechat-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Native microphone and speaker adapter for WeChat calls"

[features]
# Compatibility aliases; these features no longer select different builds.
default = []
native-audio = []

[dependencies]
rubato = "0.16"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libpulse-binding = { version = "2" }

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.12" }
coreaudio-sys = { version = "0.2" }

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = { version = "0.25" }

[[example]]
name = "isolated_loopback"
