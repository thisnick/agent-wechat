[package]
name = "wechat-protocol"
version = "2.4.0"
edition.workspace = true
license-file = "LICENSE"
publish = ["crates-io"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Native WeChat transport, authentication and protocol codecs"
keywords = ["wechat", "protocol", "profile"]
categories = ["network-programming"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "build.rs", "fixtures/**", "vendor/silk/**"]

[features]
# Compatibility aliases; these features no longer select different builds.
default = []
experimental-calls = []

[dependencies]
wechat-media = { path = "../wechat-media", version = "=2.4.0" }
wechat-platform = { path = "../wechat-platform", version = "=2.4.0" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
openssl = { version = "0.10", features = ["vendored"] }
flate2 = "1"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zeroize = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[build-dependencies]
cc = "1"
