[package]
name = "wechat-protocol"
version = "3.2.1"
edition.workspace = true
license-file = "LICENSE"
publish = ["crates-io"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Native WeChat transport, authentication and protocol codecs"
keywords = ["wechat", "protocol", "profile"]
categories = ["network-programming"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "build.rs", "fixtures/**", "vendor/silk/**"]

[features]
default = ["voice-silk", "openssl-crypto"]
# Compile the bundled C SILK voice codec (`silk::encode` and `silk::decode`).
voice-silk = ["dep:cc"]
# Use vendored OpenSSL as the cryptographic backend (default for 3.x).
openssl-crypto = ["dep:openssl"]
# Use pure-Rust cryptographic primitives (`RustCrypto` + `getrandom`) without OpenSSL.
pure-rust-crypto = [
    "dep:aes",
    "dep:aes-gcm",
    "dep:cbc",
    "dep:chacha20",
    "dep:digest",
    "dep:getrandom",
    "dep:hmac",
    "dep:md-5",
    "dep:p224",
    "dep:p256",
    "dep:pkcs8",
    "dep:poly1305",
    "dep:rand_core",
    "dep:rsa",
    "dep:sha2",
    "dep:subtle",
]
# Compatibility alias; this feature no longer selects a different build.
experimental-calls = []

[dependencies]
wechat-media = { path = "../wechat-media", version = "=3.2.1" }
anyhow.workspace = true
roxmltree = "0.21"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", default-features = false, features = ["sync", "macros"] }
url = "2"
openssl = { version = "0.10", features = ["vendored"], optional = true }
aes = { version = "0.8", features = ["zeroize"], optional = true }
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"], optional = true }
cbc = { version = "0.1", default-features = false, features = ["alloc", "block-padding", "zeroize"], optional = true }
chacha20 = { version = "0.9", default-features = false, features = ["zeroize"], optional = true }
digest = { version = "0.10", optional = true }
getrandom = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
md-5 = { version = "0.10", optional = true }
p224 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh"], optional = true }
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh", "ecdsa", "pem", "pkcs8"], optional = true }
pkcs8 = { version = "0.10", default-features = false, features = ["alloc", "pem"], optional = true }
poly1305 = { version = "0.8", default-features = false, features = ["zeroize"], optional = true }
rand_core = { version = "0.6", default-features = false, optional = true }
rsa = { version = "0.9", default-features = false, features = ["pem", "u64_digit"], optional = true }
sha2 = { workspace = true, optional = true }
subtle = { version = "2", default-features = false, optional = true }
flate2 = "1"
base64 = "0.22"
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wechat-platform = { path = "../wechat-platform", version = "=3.2.1" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time", "net", "io-util", "fs"] }

[build-dependencies]
cc = { version = "1", optional = true }
