[package]
name = "wechat-protocol"
version.workspace = true
edition.workspace = true
license-file = "LICENSE"
publish = ["crates-io"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Native WeChat transport, authentication and protocol codecs"
keywords = ["wechat", "protocol", "profile"]
categories = ["network-programming"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "build.rs", "fixtures/**", "vendor/silk/**"]

[dependencies]
wechat-media = { path = "../wechat-media", version = "=1.3.0-beta.1" }
wechat-platform = { path = "../wechat-platform", version = "=1.3.0-beta.1" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
openssl = { version = "0.10", features = ["vendored"] }
flate2 = "1"
base64 = "0.22"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zeroize = { version = "1", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[build-dependencies]
cc = "1"
