[package]
name = "wechat-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
experimental-calls = ["wechat-protocol/experimental-calls", "dep:wechat-calls"]
native-calls = ["experimental-calls", "wechat-calls/native-opus"]

[dependencies]
wechat-platform = { path = "../wechat-platform" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
wechat-store = { path = "../wechat-store" }
wechat-profile = { path = "../wechat-profile" }
wechat-protocol = { path = "../wechat-protocol" }
wechat-media = { path = "../wechat-media" }
uuid.workspace = true
chrono.workspace = true
sha2.workspace = true
md-5 = "0.10"
base64.workspace = true
openssl.workspace = true
roxmltree = "0.21"
image = { version = "0.25", default-features = false, features = ["png"] }

libc.workspace = true
zeroize.workspace = true
tempfile.workspace = true
ts-rs = "10"
jpeg-decoder = { version = "0.3.2", default-features = false }

[dev-dependencies]
rusqlite.workspace = true
zstd = "0.13"

crc32fast = "1"

[dependencies.wechat-calls]
path = "../wechat-calls"
optional = true
