[package]
name = "wechat-profile"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Readers and checked writers for supported official WeChat profiles"
keywords = ["wechat", "protocol", "profile"]
categories = ["network-programming"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "build.rs", "fixtures/**", "vendor/silk/**"]

[dependencies]
wechat-media = { path = "../wechat-media", version = "=1.3.2" }
wechat-platform = { path = "../wechat-platform", version = "=1.3.2" }
serde.workspace = true
serde_json.workspace = true
rusqlite = { workspace = true, features = ["limits", "hooks"] }
sha2.workspace = true
tempfile.workspace = true
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
base64 = "0.22"
hex = "0.4"
md-5 = "0.10"
pbkdf2 = "0.12"
hmac = "0.12"
zstd = "0.13"
aes = "0.8"
cipher = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
quick-xml = "0.38"
libc.workspace = true

openssl.workspace = true
crc32fast = "1"

chrono.workspace = true
