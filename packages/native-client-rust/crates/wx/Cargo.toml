[package]
name = "wx-native"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "wx"
path = "src/main.rs"

[features]
# Compatibility aliases; these features no longer select different builds.
default = []
native-calls = []
call-audio = []

[dependencies]
wechat-platform = { path = "../wechat-platform" }
anyhow.workspace = true
clap.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util"] }
axum.workspace = true
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
wechat-config = { path = "../wechat-config" }
wechat-store = { path = "../wechat-store" }
wechat-api = { path = "../wechat-api" }

wechat-core = { path = "../wechat-core" }
wechat-miniprogram = { path = "../wechat-miniprogram" }
wechat-profile = { path = "../wechat-profile" }
wechat-calls = { path = "../wechat-calls", features = ["native-opus"] }
wechat-audio = { path = "../wechat-audio", features = ["native-audio"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "multipart"] }
futures-util = "0.3"
base64.workspace = true
uuid.workspace = true
libc.workspace = true
fs2.workspace = true
tempfile.workspace = true
sha2.workspace = true
toml = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
