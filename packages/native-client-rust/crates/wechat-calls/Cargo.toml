[package]
name = "wechat-calls"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Portable call audio interfaces, pacing and native Opus codec"
publish = false

[features]
default = ["native-runtime"]
native-runtime = ["native-opus", "dep:wechat-protocol", "dep:anyhow", "dep:zeroize", "dep:serde"]
native-opus = ["dep:opusic-c"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
opusic-c = { version = "=1.6.1", optional = true }
wechat-protocol = { path = "../wechat-protocol", version = "=1.5.1", optional = true }
anyhow = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }
serde = { workspace = true, optional = true }

[[example]]
name = "tone_roundtrip"
required-features = ["native-opus"]
