[package]
name = "wechat-media"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Image inspection and decoding support for agent-wechat"
keywords = ["wechat", "protocol", "profile"]
categories = ["network-programming"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "build.rs", "fixtures/**", "vendor/silk/**"]

[dependencies]
wechat-platform = { path = "../wechat-platform", version = "=1.3.0-beta.0" }
anyhow.workspace = true
serde.workspace = true
tempfile.workspace = true
libc.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }

[dev-dependencies]
md-5 = "0.10"
