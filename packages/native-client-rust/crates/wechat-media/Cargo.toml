[package]
name = "wechat-media"
version = "2.4.1"
edition.workspace = true
license.workspace = true
publish = ["crates-io"]
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
description = "Image inspection and decoding support for agent-wechat"
keywords = ["wechat", "protocol", "profile"]
categories = ["network-programming"]
include = ["src/**", "tests/**", "examples/**", "README.md", "LICENSE", "NOTICE", "build.rs", "fixtures/**", "vendor/silk/**"]

[dependencies]
wechat-platform = { path = "../wechat-platform", version = "=2.4.1" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
gif = "0.14"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
md-5 = "0.10"
sha2.workspace = true
tempfile.workspace = true
libc.workspace = true
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
jpeg-decoder = { version = "0.3.2", default-features = false }
