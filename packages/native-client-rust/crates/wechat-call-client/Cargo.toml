[package]
name = "wechat-call-client"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Shared native call WebSocket transport, audio/video capture, mixing and decode foundation for wx CLI and desktop"

[dependencies]
anyhow.workspace = true
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
uuid.workspace = true
wechat-audio = { path = "../wechat-audio", features = ["native-audio"] }
wechat-call-contracts = { path = "../wechat-call-contracts" }
wechat-calls = { path = "../wechat-calls", default-features = false }
