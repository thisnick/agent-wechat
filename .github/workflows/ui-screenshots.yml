name: UI screenshots

# Captures the UI scenes in packages/client-ui/scenes with Playwright and uploads them
# to Argos. Argos compares a pull request's screenshots with the latest main build and
# adds a check the owner approves; builds on main become the baselines. Screenshots are
# not committed and not made in Docker. Upload uses GitHub Actions OIDC: do not set
# ARGOS_TOKEN, which would take precedence and skip it. Run the scenes locally with
# `pnpm --filter @agent-wechat/client-ui scenes`; nothing is uploaded outside CI.
#
# The same job also records the UI journeys (packages/client-ui/journeys) that a pull
# request adds or changes, reusing its simulator build and Chromium. The videos job
# then commits the videos under refs/ui-videos/pr-<number> and keeps one PR comment
# that shows them (scripts/ci/ui-videos-comment.mjs). Record locally with
# `pnpm --filter @agent-wechat/client-ui videos <name>`.
on:
  pull_request:
    paths:
      - 'packages/client-ui/**'
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'packages/native-client-rust/crates/wechat-simulator/**'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/ui-screenshots.yml'
      - '.github/actions/apt-install/**'
      - 'scripts/ci/apt-reuse.py'
  push:
    branches: [main]
    paths:
      - 'packages/client-ui/**'
      - 'packages/desktop/**'
      - 'packages/shared/**'
      - 'packages/native-client-rust/crates/wechat-simulator/**'
      - 'pnpm-lock.yaml'
      - '.node-version'
      - '.github/workflows/ui-screenshots.yml'
      - '.github/actions/apt-install/**'
      - 'scripts/ci/apt-reuse.py'

permissions:
  contents: read

concurrency:
  group: ui-screenshots-${{ github.ref }}
  # Every push to main is a baseline; only superseded pull request runs are cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  scenes:
    name: UI screenshots
    runs-on: ubuntu-24.04
    # Two isolated Playwright workers capture all scenes. Keep room for cold
    # Rust builds and failure diagnostics rather than trimming visual coverage.
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    outputs:
      # The journeys this pull request adds or changes, and whether any was recorded.
      journeys: ${{ steps.journeys.outputs.names }}
      recorded: ${{ steps.recorded.outputs.any }}
    steps:
      - uses: actions/checkout@v7
      - name: Find the journeys this pull request adds or changes
        id: journeys
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const journey = /^packages\/client-ui\/journeys\/([a-z0-9]+(?:-[a-z0-9]+)*)\.journey\.mjs$/;
            const files = await github.paginate(github.rest.pulls.listFiles, {
              ...context.repo, pull_number: context.payload.pull_request.number, per_page: 100,
            });
            const names = files.filter(file => file.status !== 'removed').map(file => journey.exec(file.filename)?.[1]).filter(Boolean);
            core.setOutput('names', names.join(' '));
            core.info(names.length ? `Journeys to record: ${names.join(', ')}` : 'No journey to record.');
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          toolchain: 1.93.1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-client-rust -> target
          # The automatic hash includes unused preinstalled toolchains, which
          # differ across runner images. Key the compiler we actually select.
          add-rust-environment-hash-key: false
          key: ui-screenshots-${{ steps.rust.outputs.cachekey }}
      # The fonts decide how text renders, so every run installs the same ones.
      - name: Install build tools and fonts
        uses: ./.github/actions/apt-install
        with:
          packages: cmake fonts-noto-cjk fonts-noto-color-emoji
      - run: pnpm install --frozen-lockfile
      - name: Build the simulator
        run: cargo build --profile test --locked --manifest-path packages/native-client-rust/Cargo.toml -p wechat-simulator
      - name: Install Chromium
        working-directory: packages/client-ui
        run: npx playwright install --with-deps chromium
      - name: Build the UI and the SDK it uses
        run: pnpm --filter "@agent-wechat/client-ui..." build
      - name: Capture the scenes and upload them to Argos
        # No ARGOS_TOKEN: the upload authenticates with the job's OIDC token.
        run: pnpm --filter @agent-wechat/client-ui scenes
        env:
          WX_DEV_BINARY: ${{ github.workspace }}/packages/native-client-rust/target/debug/wx-dev
      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-scenes-report
          path: |
            packages/client-ui/.scenes/report
            packages/client-ui/.scenes/results
          if-no-files-found: ignore
          retention-days: 7
      # UI videos, only for the journeys this pull request adds or changes.
      - name: Install FFmpeg
        # The desktop's pinned static FFmpeg and FFprobe: checksummed downloads in
        # seconds, where apt takes minutes. The build has no drawtext, so the contact
        # sheets CI makes have no time stamps.
        if: ${{ !cancelled() && steps.journeys.outputs.names != '' }}
        run: node scripts/ci/media-runtime.mjs "$RUNNER_TEMP/media"
      - name: Record the journeys
        id: record
        if: ${{ !cancelled() && steps.journeys.outputs.names != '' }}
        # A journey that fails or hangs is reported in the PR comment instead of failing the screenshots.
        continue-on-error: true
        timeout-minutes: 10
        # The step above allows only lowercase words joined by hyphens, so splitting is safe.
        run: pnpm --filter @agent-wechat/client-ui videos $JOURNEYS
        env:
          JOURNEYS: ${{ steps.journeys.outputs.names }}
          WX_DEV_BINARY: ${{ github.workspace }}/packages/native-client-rust/target/debug/wx-dev
      - name: Check what was recorded
        id: recorded
        if: ${{ !cancelled() && steps.journeys.outputs.names != '' }}
        run: if compgen -G 'packages/client-ui/.videos/out/*.mp4' > /dev/null; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      - name: Keep the videos
        if: ${{ !cancelled() && steps.recorded.outputs.any == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-videos
          path: packages/client-ui/.videos/out
          include-hidden-files: true
          retention-days: 30
      - name: Keep the journey report
        if: ${{ !cancelled() && steps.record.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-videos-report
          path: |
            packages/client-ui/.videos/report
            packages/client-ui/.videos/results
            packages/client-ui/.videos/raw
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  videos:
    name: UI videos
    needs: scenes
    # Branches of this repository only: a fork's token cannot write, and publishing
    # stores files in this repository. A fork's videos stay in the ui-videos artifact.
    if: ${{ !cancelled() && needs.scenes.outputs.journeys != '' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts/ci
      - uses: actions/download-artifact@v8
        if: needs.scenes.outputs.recorded == 'true'
        with:
          name: ui-videos
          path: ${{ runner.temp }}/ui-videos
      - name: Publish the videos and update the PR comment
        uses: actions/github-script@v8
        env:
          VIDEOS_DIR: ${{ runner.temp }}/ui-videos
          JOURNEYS: ${{ needs.scenes.outputs.journeys }}
        with:
          script: |
            const { publish } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci/ui-videos-comment.mjs`);
            await publish({ github, context, core, dir: process.env.VIDEOS_DIR, requested: process.env.JOURNEYS });
