name: Release

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [Prepare native release assets]
    types: [completed]
    branches: [main]

# Serialize the completion handoff after the original push run has finished.
concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # Version commits must synchronize the standalone Rust workspace lockfile.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1

      # No setup-node registry auth placeholder: publishing uses GitHub OIDC.
      - name: Install verified standalone npm 11.12.1
        run: bash scripts/install-ci-npm.sh

      - name: Check npm publisher
        run: |
          test "$(npm --version)" = "11.12.1"
          node --test scripts/verify-ci-publisher.test.mjs
          node scripts/verify-ci-publisher.mjs

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Native assets are published separately with explicit operator approval.
      # Missing assets are expected until that workflow completes.
      - name: Validate npm stable or prerelease channel
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/native-release-policy.mjs --check-registry

      - name: Check whether native assets are ready
        id: native_release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: node scripts/native-release-orchestration.mjs ready
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify native assets and embed npm checksum manifest
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.native_release.outputs.ready == 'true'
        run: node scripts/native-prepare-package.mjs --if-unpublished

      # Publish separately so npm can use OIDC (no NODE_AUTH_TOKEN needed)
      - name: Publish to npm
        id: publish
        if: steps.changesets.outputs.hasChangesets == 'false' && steps.native_release.outputs.ready == 'true'
        run: |
          if ! OUTPUT=$(pnpm changeset publish 2>&1); then
            echo "$OUTPUT"
            exit 1
          fi
          echo "$OUTPUT"

        env:
          NPM_CONFIG_PROVENANCE: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  resume:
    name: Resume npm release after native publication
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'workflow_dispatch' || github.event.workflow_run.event == 'push') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest
    steps:
      # Use trusted default-branch orchestration code. This job only retries the
      # original push run; it never builds or publishes npm from workflow_run.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node scripts/native-release-orchestration.mjs resume
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ github.event.workflow_run.id }}
          NATIVE_SOURCE_COMMIT: ${{ github.event.workflow_run.head_sha }}
