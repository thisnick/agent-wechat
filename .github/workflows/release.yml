name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.artifact_release.outputs.released }}
      releaseVersion: ${{ steps.artifact_release.outputs.releaseVersion }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Create Release PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: "Version Packages"
          commit: "Version Packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare artifact release
        id: artifact_release
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          VERSION=$(jq -r '.version' packages/agent-server-rust/package.json)
          TAG="v${VERSION}"
          TAG_SHA=""
          if EXISTING_TAG_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null); then
            TAG_SHA="$EXISTING_TAG_SHA"
          fi
          RELEASE_COMPLETE="false"
          if EXISTING_RELEASE_COMPLETE=$(gh release view "$TAG" --json assets --jq 'any(.assets[]; .name == "release-complete.json")' 2>/dev/null); then
            RELEASE_COMPLETE="$EXISTING_RELEASE_COMPLETE"
          fi

          if [ -z "$TAG_SHA" ] || [ "$TAG_SHA" = "$GITHUB_SHA" ] || [ "$RELEASE_COMPLETE" != "true" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

          echo "releaseVersion=$VERSION" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-binary:
    name: Binary (${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION='${{ needs.release.outputs.releaseVersion }}'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build binary in Docker
        run: |
          RUST_DIR="packages/agent-server-rust"
          BUILDER_IMAGE="rust:1.93-bookworm"

          docker run --rm \
            --platform ${{ matrix.platform }} \
            -v "$PWD/$RUST_DIR:/build" \
            -v "agent-wechat-cargo-cache-${{ matrix.arch }}:/build/target" \
            -v "agent-wechat-cargo-registry-${{ matrix.arch }}:/usr/local/cargo/registry" \
            -w /build \
            "$BUILDER_IMAGE" \
            cargo build --release

          # Extract binary from cache volume
          TMP_CT=$(docker create \
            -v "agent-wechat-cargo-cache-${{ matrix.arch }}:/target:ro" \
            "$BUILDER_IMAGE")
          docker cp "$TMP_CT:/target/release/agent-server" ./agent-server
          docker rm "$TMP_CT" > /dev/null

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="agent-server-${VERSION}-linux-${{ matrix.arch }}"
          mv agent-server "$ASSET"
          chmod +x "$ASSET"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "Release v${VERSION}" 2>/dev/null || true
          gh release upload "v${VERSION}" "$ASSET" --clobber

  publish-tools:
    name: Docker Tools
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          VERSION='${{ needs.release.outputs.releaseVersion }}'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Package tools
        run: |
          tar -czf "docker-tools-${{ steps.version.outputs.version }}.tar.gz" -C docker tools

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "v${VERSION}" --title "v${VERSION}" --notes "Release v${VERSION}" 2>/dev/null || true
          gh release upload "v${VERSION}" "docker-tools-${VERSION}.tar.gz" --clobber

  publish-docker:
    name: Docker (${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Docker context
        run: |
          rm -rf docker/agent-server-rust
          mkdir -p docker/agent-server-rust
          cp packages/agent-server-rust/Cargo.toml docker/agent-server-rust/
          [ -f packages/agent-server-rust/Cargo.lock ] && cp packages/agent-server-rust/Cargo.lock docker/agent-server-rust/
          cp -r packages/agent-server-rust/src docker/agent-server-rust/
          cp -r packages/agent-server-rust/migrations docker/agent-server-rust/

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract version
        id: version
        run: |
          VERSION='${{ needs.release.outputs.releaseVersion }}'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-docker-manifest:
    name: Docker Manifest
    needs: [release, publish-docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION='${{ needs.release.outputs.releaseVersion }}'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.version.outputs.version }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " $(ls /tmp/digests/))

  publish-wechaty-gateway:
    name: Wechaty Gateway (${{ matrix.arch }})
    needs: release
    if: needs.release.outputs.released == 'true'
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: echo "name=$(echo "ghcr.io/${GITHUB_REPOSITORY}-wechaty-gateway" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/wechaty-gateway/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=wechaty-gateway-${{ matrix.arch }}
          cache-to: type=gha,scope=wechaty-gateway-${{ matrix.arch }},mode=max

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          DIGEST="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: wechaty-gateway-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-wechaty-gateway-manifest:
    name: Wechaty Gateway Manifest
    needs: [release, publish-wechaty-gateway]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: wechaty-gateway-digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version
        id: version
        run: |
          VERSION='${{ needs.release.outputs.releaseVersion }}'
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest
        run: |
          IMAGE=$(echo "ghcr.io/${GITHUB_REPOSITORY}-wechaty-gateway" | tr '[:upper:]' '[:lower:]')
          docker buildx imagetools create \
            -t "${IMAGE}:${{ steps.version.outputs.version }}" \
            -t "${IMAGE}:latest" \
            $(printf "${IMAGE}@sha256:%s " $(ls /tmp/digests/))

  finalize-release:
    name: Finalize Release
    needs: [release, publish-binary, publish-tools, merge-docker-manifest, merge-wechaty-gateway-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Mark release complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION='${{ needs.release.outputs.releaseVersion }}'
          echo "Release v${VERSION} completed by ${GITHUB_SHA}" > release-complete.json
          gh release upload "v${VERSION}" release-complete.json --repo "$GITHUB_REPOSITORY" --clobber
