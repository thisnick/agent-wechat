name: Native macOS and Windows candidates
on:
  workflow_call:
    inputs:
      artifact_prefix:
        type: string
        default: native-validation
  workflow_dispatch:
    inputs:
      artifact_prefix:
        type: string
        default: native-validation
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-client-rust
          key: portable-${{ matrix.target }}
      - name: Select native Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'amd64' }}
      - name: Select Windows Perl for vendored OpenSSL
        if: runner.os == 'Windows'
        run: |
          if [ ! -x /c/Strawberry/perl/bin/perl.exe ]; then choco install strawberryperl --no-progress -y; fi
          echo 'C:\Strawberry\perl\bin' >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-wechat/agent-wechat... build
      # Git Bash prepends its coreutils link.exe ahead of the MSVC linker.
      - run: cargo test -p wechat-platform --locked --manifest-path packages/native-client-rust/Cargo.toml --target ${{ matrix.target }}
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      - run: cargo build --release --locked --manifest-path packages/native-client-rust/Cargo.toml --target ${{ matrix.target }}
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
      - run: node scripts/native-portable-build.mjs
      - name: Validate actual executable and npm installation
        run: |
          BINARY=$(node --input-type=module -e "import {assetName} from './packages/cli/scripts/native-runtime.mjs'; import fs from 'node:fs'; console.log('artifacts/native/'+assetName(JSON.parse(fs.readFileSync('packages/cli/package.json')).version))")
          node scripts/native-platform-smoke.mjs "$BINARY"
          node scripts/native-package-smoke.mjs artifacts/native
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_prefix || 'native-validation' }}-${{ matrix.target }}
          path: artifacts/native/*
          if-no-files-found: error
