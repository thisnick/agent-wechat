name: CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - '.github/workflows/native-release.yml'
      - 'scripts/client-ui-smoke.mjs'
      - 'scripts/native-release-notes*.mjs'
      - 'scripts/native-release-policy*.mjs'
      - 'scripts/native-release-orchestration*.mjs'
      - '.changeset/**'
      - 'scripts/install-ci-npm.sh'
      - 'scripts/verify-ci-publisher*.mjs'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      docs: ${{ steps.filter.outputs.docs }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            release:
              - '.github/workflows/release.yml'
              - '.github/workflows/native-release.yml'
              - '.github/workflows/native-image.yml'
              - 'scripts/native-release-notes*.mjs'
              - 'scripts/native-release-policy*.mjs'
              - 'scripts/native-release-orchestration*.mjs'
              - 'scripts/native-release-trigger*.mjs'
              - '.changeset/**'
              - 'scripts/install-ci-npm.sh'
              - 'scripts/verify-ci-publisher*.mjs'
            ts:
              - 'packages/cli/**'
              - 'packages/shared/**'
              - 'packages/client-ui/**'
              - 'scripts/client-ui-smoke.mjs'
              - 'packages/openclaw-extension/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  release-tools:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bash -n scripts/install-ci-npm.sh
      - run: bash scripts/install-ci-npm.sh
      - run: |
          test "$(npm --version)" = "11.12.1"
          node --test scripts/verify-ci-publisher.test.mjs
          node --test scripts/native-release-notes.test.mjs
          node --test scripts/native-release-policy.test.mjs
          node --test scripts/native-release-orchestration.test.mjs
          node --test scripts/native-release-trigger.test.mjs
          node scripts/verify-ci-publisher.mjs

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (all packages)
        run: pnpm -r --if-present test

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @agent-wechat/docs

      - name: Build docs
        run: pnpm --filter @agent-wechat/docs build
