name: CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'docs/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
      - '.github/workflows/release.yml'
      - 'scripts/install-ci-npm.sh'
      - 'scripts/verify-npm-release*.mjs'
      - 'scripts/verify-ci-publisher*.mjs'

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ts: ${{ steps.filter.outputs.ts }}
      rust: ${{ steps.filter.outputs.rust }}
      docs: ${{ steps.filter.outputs.docs }}
      release: ${{ steps.filter.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            release:
              - '.github/workflows/release.yml'
              - 'scripts/install-ci-npm.sh'
              - 'scripts/verify-npm-release*.mjs'
              - 'scripts/verify-ci-publisher*.mjs'
            ts:
              - 'packages/cli/**'
              - 'packages/shared/**'
              - 'packages/openclaw-extension/**'
              - 'packages/wechaty-gateway/**'
              - 'packages/wechaty-puppet/**'
              - 'pnpm-lock.yaml'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.json'
              - '.github/workflows/ci.yml'
            rust:
              - 'packages/agent-server-rust/**'
              - '.github/workflows/ci.yml'
            docs:
              - 'docs/**'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  release-tools:
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bash -n scripts/install-ci-npm.sh
      - run: bash scripts/install-ci-npm.sh
      - run: |
          test "$(npm --version)" = "11.12.1"
          node --test scripts/verify-npm-release.test.mjs scripts/verify-ci-publisher.test.mjs
          node scripts/verify-ci-publisher.mjs

  ts:
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (all packages)
        run: pnpm -r --if-present test

  rust:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        run: cargo check --manifest-path packages/agent-server-rust/Cargo.toml

      - name: Cargo test
        run: cargo test --manifest-path packages/agent-server-rust/Cargo.toml

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @agent-wechat/docs

      - name: Build docs
        run: pnpm --filter @agent-wechat/docs build
