name: Claude Code Review

# Reviews a pull request when it opens, becomes ready for review, or receives
# new commits, and posts findings as inline comments. Pushes to main never
# trigger it: only pull request events do. Draft PRs are skipped until they
# are marked ready. Fork PRs are skipped because GitHub withholds secrets from
# them on a public repository, and bot PRs are skipped to save runs.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A newer push supersedes a review still in progress.
    concurrency:
      group: claude-code-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          # The plugin stops once Claude has commented on a pull request, so
          # each push overrides that check and skips findings already posted.
          prompt: >-
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            This review runs on every push. In step 1, ignore the condition that Claude has already commented, and review the current head commit.
            Before posting, list the existing inline comments with `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments --paginate`, and do not post an issue that an earlier Claude comment already reports for the same lines.
            Post the no-issues summary comment only if Claude has not commented on this pull request before; otherwise, when there is nothing new to report, post nothing.
          # The inline-comment MCP server only starts when --allowedTools names it.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment" "Bash(gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments:*)"
          # The plugin asks for Haiku/Sonnet on some subagents; force Opus throughout.
          settings: |
            {"env": {"CLAUDE_CODE_SUBAGENT_MODEL": "claude-opus-5-5", "CLAUDE_CODE_SUBAGENT_MODEL_FORCE": "1"}}
