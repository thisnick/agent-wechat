name: Claude Code Review

# Reviews each pull request once, when it opens or becomes ready for review,
# and posts findings as inline comments. Fork PRs are skipped because GitHub
# withholds secrets from them on a public repository; draft and bot PRs are
# skipped to save runs.
on:
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency: claude-code-review-${{ github.event.pull_request.number }}

jobs:
  review:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-plugins-official.git"
          plugins: "code-review@claude-plugins-official"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # The inline-comment MCP server only starts when --allowedTools names it.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
          # The plugin asks for Haiku/Sonnet on some subagents; force Opus throughout.
          settings: |
            {"env": {"CLAUDE_CODE_SUBAGENT_MODEL": "claude-opus-5-5", "CLAUDE_CODE_SUBAGENT_MODEL_FORCE": "1"}}
