name: Native distribution validation
on:
  pull_request:
    paths:
      - 'packages/native-client-rust/**'
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'packages/openclaw-extension/**'
      - 'scripts/native-*'
      - 'deploy/native/**'
      - '.github/workflows/native-*'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
  push:
    branches: [main]
    paths:
      - 'packages/native-client-rust/**'
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'packages/openclaw-extension/**'
      - 'scripts/native-*'
      - 'deploy/native/**'
      - '.github/workflows/native-*'
      - '.github/workflows/release.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.dockerignore'
permissions:
  contents: read
jobs:
  openclaw-smoke:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-wechat/agent-wechat... build
      - run: node scripts/native-gateway-smoke.mjs
      - run: node scripts/native-model-smoke.mjs
      - run: node scripts/native-media-model-smoke.mjs

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: docker/setup-buildx-action@v4.4.1
        id: buildx
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-wechat/cli... build
      - run: pnpm --filter @agent-wechat/cli test
      - run: pnpm --filter @agent-wechat/shared test
      - run: pnpm --filter @agent-wechat/agent-wechat... build
      - run: pnpm --filter @agent-wechat/agent-wechat typecheck
      - run: pnpm --filter @agent-wechat/agent-wechat test
      - run: node --test scripts/native-release-preflight.test.mjs scripts/native-merge-release.test.mjs
      - run: python3 scripts/native-build-release.test.py
      - name: Build and test the native release executable
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/native/Dockerfile
          target: builder
          platforms: ${{ matrix.platform }}
          load: true
          tags: native-release-builder:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=native-linux-${{ runner.arch }}
      - run: bash scripts/native-build-release.sh
        env:
          NATIVE_RELEASE_BUILDER_IMAGE: native-release-builder:ci
      - run: node scripts/native-package-smoke.mjs artifacts/native
      - name: Validate actual CLI lifecycle and account selection without a native login
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          python3 scripts/native-cli-smoke.py "artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
          python3 scripts/native-cli-fixture-test.py "artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
          python3 scripts/native-export-smoke.py "artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
      - name: Validate real managed/external OpenClaw hosting without account credentials
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node --experimental-strip-types scripts/native-openclaw-smoke.mjs "artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
      - name: Build standalone image without publishing or starting a service
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/native/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: agent-wechat-native:ci
          cache-from: type=gha,scope=native-linux-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=native-linux-${{ runner.arch }}
      - name: Check image identity without touching account data
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges agent-wechat-native:ci --json version
      - run: python3 scripts/native-container-smoke.py agent-wechat-native:ci
      - name: Validate deployment examples without applying them
        run: |
          mkdir -p deploy/native/secrets
          printf 'validation-placeholder-not-a-real-secret\n' > deploy/native/secrets/api-token
          docker compose -f deploy/native/compose.yaml config --quiet
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          python3 scripts/native-service-verify.py "$PWD/artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
      - uses: actions/upload-artifact@v4
        with:
          name: native-linux-${{ matrix.arch }}-gnu-validation
          path: artifacts/native/*
          if-no-files-found: error

  matrix-manifest:
    needs: [package, openclaw-smoke]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*-gnu-validation
          path: artifacts/fragments
      - name: Verify complete release matrix without publication
        run: node scripts/native-merge-release.mjs artifacts/native artifacts/fragments/native-linux-x64-gnu-validation artifacts/fragments/native-linux-arm64-gnu-validation
