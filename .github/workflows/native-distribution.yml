name: Native distribution validation
on:
  pull_request:
    paths:
      - 'packages/desktop/**'
      - 'packages/client-ui/**'
      - 'packages/native-client-rust/**'
      - 'rust-toolchain.toml'
      - 'packages/cli/**'
      - 'packages/shared/**'
      - 'packages/openclaw-extension/**'
      - 'scripts/ci/**'
      - 'scripts/release/**'
      - 'scripts/smoke/**'
      - 'deploy/native/**'
      - '.github/workflows/native-*'
      - '.github/workflows/desktop.yml'
      - '.github/actions/apt-install/**'
      - '.github/workflows/windows-signing.yml'
      - '.github/workflows/release.yml'
      - 'package.json'
      - '.node-version'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.cargo/config*'
      - '.dockerignore'
  # PR runs only read the Rust and Docker caches, so main fills them when the
  # dependencies, compiler, Dockerfile or these workflows change. The weekly
  # run renews entries that GitHub deletes after seven days without a read.
  push:
    branches: [main]
    paths:
      - 'packages/native-client-rust/Cargo.lock'
      - 'packages/native-client-rust/Cargo.toml'
      - 'packages/native-client-rust/crates/*/Cargo.toml'
      - 'packages/native-client-rust/**/.cargo/config*'
      - 'packages/desktop/src-tauri/Cargo.lock'
      - 'packages/desktop/src-tauri/Cargo.toml'
      - 'rust-toolchain.toml'
      - '.cargo/config*'
      - 'deploy/native/Dockerfile'
      - 'scripts/ci/cache-key*.py'
      - '.github/workflows/native-distribution.yml'
      - '.github/workflows/native-portable.yml'
      - '.github/workflows/desktop.yml'
      - '.github/actions/apt-install/**'
      - 'scripts/ci/apt-reuse.py'
  schedule:
    - cron: '41 10 * * 0'
permissions:
  contents: read
concurrency:
  group: native-distribution-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    # Main-branch runs exist to fill the caches, so they build everything that
    # has one and skip the OpenClaw smoke tests.
    outputs:
      native: ${{ github.event_name != 'pull_request' || steps.filter.outputs.native == 'true' }}
      openclaw: ${{ github.event_name == 'pull_request' && steps.filter.outputs.openclaw == 'true' }}
      desktop: ${{ github.event_name != 'pull_request' || steps.filter.outputs.desktop == 'true' }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
      - uses: dorny/paths-filter@v4
        if: github.event_name == 'pull_request'
        id: filter
        with:
          filters: |
            native:
              - 'packages/native-client-rust/**'
              - 'packages/cli/**'
              - 'rust-toolchain.toml'
              - 'scripts/release/build*'
              - 'scripts/ci/**'
              - 'scripts/smoke/media-assertions*.mjs'
              - 'scripts/smoke/container.py'
              - 'scripts/release/merge*'
              - 'scripts/smoke/package.mjs'
              - 'scripts/smoke/platform.mjs'
              - 'scripts/release/portable-build.mjs'
              - 'scripts/release/manifest.mjs'
              - 'scripts/release/preflight*'
              - 'scripts/smoke/service.py'
              - 'scripts/smoke/simulator.mjs'
              - 'deploy/native/**'
              - '.github/workflows/native-client.yml'
              - '.github/workflows/native-distribution.yml'
              - '.github/workflows/native-portable.yml'
              - '.github/workflows/native-release.yml'
              - 'package.json'
              - '.node-version'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.cargo/config*'
              - '.dockerignore'
            openclaw:
              - 'packages/openclaw-extension/**'
              - 'packages/shared/**'
              - '.github/workflows/native-distribution.yml'
              - 'package.json'
              - '.node-version'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            desktop:
              - 'deploy/native/Dockerfile'
              - 'scripts/release/build.sh'
              - 'scripts/release/portable-build.mjs'
              - 'scripts/release/manifest.mjs'
              - '.github/workflows/native-portable.yml'
              - '.github/workflows/native-release.yml'
              - 'packages/desktop/**'
              - 'packages/client-ui/**'
              - 'packages/shared/**'
              - 'packages/native-client-rust/**'
              - 'packages/cli/**'
              - 'scripts/ci/**'
              - '.github/workflows/desktop.yml'
              - '.github/actions/apt-install/**'
              - '.github/workflows/windows-signing.yml'
              - '.github/workflows/native-distribution.yml'
              - 'rust-toolchain.toml'
              - 'package.json'
              - '.node-version'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - '.cargo/config*'

  openclaw-smoke:
    needs: changes
    if: needs.changes.outputs.openclaw == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite: [model, media-model, tools, voice-current]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-wechat/agent-wechat... build
      - name: Install current Gateway for voice boundary regression
        if: matrix.suite == 'voice-current'
        run: npm install --prefix "$RUNNER_TEMP/openclaw-voice-current" --ignore-scripts --no-audit --no-fund openclaw@2026.11.1
      - name: Validate pinned Gateway and model integration
        env:
          SMOKE_SUITE: ${{ matrix.suite }}
        run: |
          case "$SMOKE_SUITE" in
            model|media-model) node "packages/openclaw-extension/test/smoke/${SMOKE_SUITE}.mjs" ;;
            voice-current)
              OPENCLAW_TEST_SDK_ROOT="$RUNNER_TEMP/openclaw-voice-current/node_modules/openclaw" node packages/openclaw-extension/test/smoke/conference-model.mjs
              ;;
            tools)
              node packages/openclaw-extension/test/smoke/gateway.mjs
              node packages/openclaw-extension/test/smoke/conference-model.mjs
              node packages/openclaw-extension/test/smoke/history-model.mjs
              node packages/openclaw-extension/test/smoke/recall-model.mjs
              node packages/openclaw-extension/test/smoke/archive-tools.mjs
              ;;
            *) echo "Unknown smoke suite: $SMOKE_SUITE" >&2; exit 1 ;;
          esac

  package:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            platform: linux/amd64
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: docker/setup-buildx-action@v4.4.1
        id: buildx
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-wechat/cli... build
      - run: pnpm --filter @agent-wechat/agent-wechat... build
      - name: Build the native release executable
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/native/Dockerfile
          target: release-artifact
          platforms: ${{ matrix.platform }}
          load: true
          tags: native-release-builder:ci
          labels: org.opencontainers.image.revision=${{ github.sha }}
          # Export this solve directly: the later runtime solve must not replace
          # the executable target's cache records on a fresh builder. Only main
          # exports it (2m12s per run); PRs read main's copy.
          cache-from: |
            type=gha,scope=native-linux-artifact-${{ runner.arch }}
            type=gha,scope=native-linux-${{ runner.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=gha,mode=max,scope=native-linux-artifact-{0}', runner.arch) || '' }}
      - run: bash scripts/release/build.sh
        env:
          NATIVE_RELEASE_BUILDER_IMAGE: native-release-builder:ci
          NATIVE_CI_ARTIFACT: true
      - run: node scripts/smoke/package.mjs artifacts/native
      - name: Validate actual CLI lifecycle and account selection without a native login
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          python3 packages/native-client-rust/scripts/cli-smoke.py "artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
          python3 packages/native-client-rust/scripts/cli-fixture-test.py "artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
          python3 packages/native-client-rust/scripts/export-smoke.py "artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
      - name: Validate real managed/external OpenClaw hosting without account credentials
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          node --experimental-strip-types packages/openclaw-extension/test/smoke/host.mjs "artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
      - name: Build standalone image without publishing or starting a service
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/native/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          tags: agent-wechat-native:ci
          # No export: the builder layers come from the artifact scope above, and
          # the runtime layer takes about 20 seconds. The native-linux scope
          # belongs to release builds.
          cache-from: |
            type=gha,scope=native-linux-artifact-${{ runner.arch }}
            type=gha,scope=native-linux-${{ runner.arch }}
      - name: Check image identity without touching account data
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges agent-wechat-native:ci --json version
      - run: python3 scripts/smoke/container.py agent-wechat-native:ci
      - name: Validate deployment examples without applying them
        run: |
          mkdir -p deploy/native/secrets
          printf 'validation-placeholder-not-a-real-secret\n' > deploy/native/secrets/api-token
          docker compose -f deploy/native/compose.yaml config --quiet
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          python3 scripts/smoke/service.py "$PWD/artifacts/native/wx-v${VERSION}-linux-${{ matrix.arch }}-gnu"
      - uses: actions/upload-artifact@v7
        with:
          name: native-validation-${{ matrix.target }}
          path: artifacts/native/*
          if-no-files-found: error

  portable:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    uses: ./.github/workflows/native-portable.yml
    with:
      windows_simulator: true
      # Main-branch runs fill the caches PRs read; releases add Windows ARM64.
      windows_arm64: false

  desktop:
    needs: [changes, package, portable]
    permissions:
      contents: read
      id-token: write
    if: >-
      !cancelled() && needs.changes.outputs.desktop == 'true' &&
      (needs.package.result == 'success' || needs.package.result == 'skipped') &&
      (needs.portable.result == 'success' || needs.portable.result == 'skipped')
    uses: ./.github/workflows/desktop.yml
    with:
      native_artifact_prefix: ${{ needs.changes.outputs.native == 'true' && 'native-validation' || '' }}
