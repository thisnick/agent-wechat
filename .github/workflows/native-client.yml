name: Native client

on:
  pull_request:
    paths:
      - 'packages/native-client-rust/**'
      - 'packages/shared/src/native*'
      - 'scripts/native-generate-types.sh'
      - '.github/workflows/native-client.yml'
  push:
    branches: [main]
    paths:
      - 'packages/native-client-rust/**'
      - 'packages/shared/src/native*'
      - 'scripts/native-generate-types.sh'
      - '.github/workflows/native-client.yml'

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: packages/native-client-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-client-rust -> target
          # The automatic hash includes unused preinstalled toolchains, which
          # differ across runner images. Key the compiler we actually select.
          add-rust-environment-hash-key: false
          key: native-${{ matrix.runner }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('packages/native-client-rust/**/Cargo.toml', 'packages/native-client-rust/Cargo.lock', 'packages/native-client-rust/**/.cargo/config*', '.cargo/config*') }}
      - run: cargo fmt --all --check
      - name: Ensure image decoder runtime
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --profile test --locked
      - run: bash ../../scripts/native-generate-types.sh --check
        env:
          # Reuse the optimized test dependencies for cargo run in this script.
          CARGO_PROFILE_DEV_OPT_LEVEL: 1
      - run: python3 scripts/smoke.py target/debug/wx
