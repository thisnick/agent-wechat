name: Native client

on:
  workflow_call:
    inputs:
      simulator_checks:
        description: Build and exercise the development upstream simulator
        type: boolean
        default: true
  pull_request:
    paths:
      - 'packages/native-client-rust/**'
      - 'rust-toolchain.toml'
      - '.cargo/config*'
      - 'packages/shared/src/native*'
      - 'scripts/generate-types.sh'
      - 'scripts/smoke/simulator.mjs'
      - 'scripts/smoke/calls-api.mjs'
      - 'packages/openclaw-extension/src/calls*'
      - 'packages/client-ui/**'
      - '.node-version'
      - 'pnpm-lock.yaml'
      - 'scripts/ci/cache-key*.py'
      - '.github/workflows/native-client.yml'
      - '.github/actions/apt-install/**'
      - 'scripts/ci/apt-reuse.py'
  # PR runs only read the Rust cache, so main fills it. rust-cache stores
  # dependencies, not workspace crates, so main needs a run only when the
  # dependency set, compiler or this workflow changes. The weekly run renews
  # entries that GitHub deletes after seven days without a read.
  push:
    branches: [main]
    paths:
      - 'packages/native-client-rust/Cargo.lock'
      - 'packages/native-client-rust/Cargo.toml'
      - 'packages/native-client-rust/crates/*/Cargo.toml'
      - 'packages/native-client-rust/**/.cargo/config*'
      - 'rust-toolchain.toml'
      - '.cargo/config*'
      - 'scripts/ci/cache-key*.py'
      - '.github/workflows/native-client.yml'
      - '.github/actions/apt-install/**'
      - 'scripts/ci/apt-reuse.py'
  schedule:
    - cron: '23 10 * * 0'

permissions:
  contents: read

concurrency:
  # A release calls this workflow on main too; keep its run apart from the
  # cache-filling run that the same push can start.
  group: native-client-${{ github.ref }}-${{ toJSON(inputs.simulator_checks) }}
  cancel-in-progress: true

env:
  # Keep the contract generator and tests on the same dependency profile.
  # Debug assertions remain enabled; large debug symbols only slow CI linking.
  CARGO_PROFILE_DEV_OPT_LEVEL: 1
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  FFMPEG_RELEASE: b6.1.1
  # Only a release caller passes simulator_checks: false. Pull requests and the
  # main-branch runs that fill the cache have no inputs and run every check.
  SIMULATOR_CHECKS: ${{ toJSON(inputs.simulator_checks) != 'false' }}

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        # Releases add ARM64; main-branch runs fill the cache PRs read, so they
        # use the PR matrix.
        runner: ${{ fromJSON(toJSON(inputs.simulator_checks) == 'false' && '["ubuntu-24.04","ubuntu-24.04-arm"]' || '["ubuntu-24.04"]') }}
        suite: [lint, test]
        exclude:
          - runner: ubuntu-24.04-arm
            suite: lint
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      FFMPEG_ARCH: ${{ matrix.runner == 'ubuntu-24.04-arm' && 'arm64' || 'x64' }}
      FFMPEG_SHA256: ${{ matrix.runner == 'ubuntu-24.04-arm' && '754a678672298bc68156adff58aa7385a592c2b30b1d0ae8750c45c915c4bac0' || 'bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa' }}
      FFPROBE_SHA256: ${{ matrix.runner == 'ubuntu-24.04-arm' && '2ab6aba60ee84412dff9188720703376cb4e7aaf7e0b5e43aa8249f2acae5bf8' || '25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067' }}
    defaults:
      run:
        working-directory: packages/native-client-rust
    steps:
      - uses: actions/checkout@v7
      - name: Identify native build dependencies
        id: cache-key
        run: python ../../scripts/ci/cache-key.py rust --github-output
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          toolchain: 1.93.1
          components: rustfmt, clippy
          targets: ${{ matrix.suite == 'test' && runner.arch == 'X64' && 'wasm32-unknown-unknown' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-client-rust -> target
          # The automatic hash includes unused preinstalled toolchains, which
          # differ across runner images. Key the compiler we actually select.
          add-rust-environment-hash-key: false
          # A release skips the simulator and so builds a different set.
          key: native-${{ matrix.runner }}-${{ matrix.suite }}-${{ steps.rust.outputs.cachekey }}-opt${{ env.CARGO_PROFILE_DEV_OPT_LEVEL }}-debug${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}-sim${{ env.SIMULATOR_CHECKS }}-${{ steps.cache-key.outputs.rust }}
          # Each PR saving its own copy filled the repository's 10 GB cache
          # limit and evicted the others. PRs read what main saved.
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install native build tools
        uses: ./.github/actions/apt-install
        with:
          packages: cmake
      - if: matrix.suite == 'lint'
        run: cargo fmt --all --check
      - if: matrix.suite == 'lint'
        run: |
          packages=()
          if [ "$SIMULATOR_CHECKS" != true ]; then
            packages+=(--exclude wechat-simulator)
          fi
          cargo clippy --workspace "${packages[@]}" --all-targets --locked -- -D warnings
      - name: Restore pinned image decoder runtime
        if: matrix.suite == 'test'
        id: ffmpeg-cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/native-ffmpeg
          key: native-ffmpeg-${{ runner.arch }}-${{ env.FFMPEG_RELEASE }}-${{ env.FFMPEG_SHA256 }}-${{ env.FFPROBE_SHA256 }}
      - name: Install verified image decoder runtime
        if: matrix.suite == 'test' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/eugeneware/ffmpeg-static/releases/download/$FFMPEG_RELEASE"
          mkdir -p "$RUNNER_TEMP/native-ffmpeg/bin"
          for media_tool in ffmpeg ffprobe; do
            archive="$RUNNER_TEMP/$media_tool.gz"
            expected_sha="$FFMPEG_SHA256"
            if [ "$media_tool" = ffprobe ]; then expected_sha="$FFPROBE_SHA256"; fi
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 180 \
              "$base/$media_tool-linux-$FFMPEG_ARCH.gz" --output "$archive"
            printf '%s  %s\n' "$expected_sha" "$archive" | sha256sum --check
            gzip --decompress --stdout "$archive" > "$RUNNER_TEMP/native-ffmpeg/bin/$media_tool"
            chmod 755 "$RUNNER_TEMP/native-ffmpeg/bin/$media_tool"
          done
          curl --fail --location --retry 3 "$base/linux-$FFMPEG_ARCH.LICENSE" \
            --output "$RUNNER_TEMP/native-ffmpeg/LICENSE"
          printf '%s  %s\n' 8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903 \
            "$RUNNER_TEMP/native-ffmpeg/LICENSE" | sha256sum --check
      - name: Enable the pinned image decoder
        if: matrix.suite == 'test'
        run: |
          "$RUNNER_TEMP/native-ffmpeg/bin/ffmpeg" -version
          "$RUNNER_TEMP/native-ffmpeg/bin/ffprobe" -version
          echo "$RUNNER_TEMP/native-ffmpeg/bin" >> "$GITHUB_PATH"
      # Cargo chooses dependency features once per command. A command limited
      # to one package (-p), or one that builds no tests or examples, leaves out
      # features the rest of the workspace and its dev-dependencies turn on, so
      # it recompiled crates such as tokio, hyper, axum and every workspace
      # crate. Build every binary, example and test here in one command; the
      # tests and smoke checks below reuse these outputs from target/debug.
      - name: Build workspace binaries, examples and tests
        if: matrix.suite == 'test'
        run: |
          packages=()
          if [ "$SIMULATOR_CHECKS" != true ]; then
            packages+=(--exclude wechat-simulator)
          fi
          cargo build --workspace "${packages[@]}" --all-targets --profile test --locked
      - if: matrix.suite == 'test'
        run: |
          packages=()
          if [ "$SIMULATOR_CHECKS" != true ]; then
            packages+=(--exclude wechat-simulator)
          fi
          cargo test --workspace "${packages[@]}" --locked
      # Workspace default-feature tests above already cover the native codec and
      # audio libraries. Keep the virtual-device and portable-target checks here
      # instead of scheduling another Linux runner for the same unit tests.
      - name: Exercise generated audio through an isolated sound server
        if: matrix.suite == 'test' && runner.arch == 'X64'
        run: bash crates/wechat-audio/tests/pulse-loopback.sh target/debug/examples/isolated_loopback
      - name: Check portable call media for WebAssembly
        if: matrix.suite == 'test' && runner.arch == 'X64'
        run: cargo check --locked -p wechat-calls --no-default-features --target wasm32-unknown-unknown
      - if: matrix.suite == 'test'
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Exercise the real hub through the local upstream simulator
        if: matrix.suite == 'test' && env.SIMULATOR_CHECKS == 'true'
        run: node ../../scripts/smoke/simulator.mjs
      - if: matrix.suite == 'test' && runner.arch == 'X64'
        env:
          NATIVE_CONTRACTS_GENERATOR: ${{ github.workspace }}/packages/native-client-rust/target/debug/examples/generate_contracts
        run: bash ../../scripts/generate-types.sh --check
      - if: matrix.suite == 'test'
        run: python3 scripts/smoke.py target/debug/wx
      - if: matrix.suite == 'test' && env.SIMULATOR_CHECKS == 'true' && (runner.arch == 'X64' || github.event_name != 'pull_request')
        uses: pnpm/action-setup@v6
      - name: Install browser-client test dependencies
        if: matrix.suite == 'test' && env.SIMULATOR_CHECKS == 'true' && (runner.arch == 'X64' || github.event_name != 'pull_request')
        working-directory: .
        run: pnpm install --frozen-lockfile --filter @agent-wechat/client-ui... --filter @agent-wechat/agent-wechat...
      - name: Exercise the connected session and UI launcher with synthetic accounts
        if: matrix.suite == 'test' && env.SIMULATOR_CHECKS == 'true' && (runner.arch == 'X64' || github.event_name != 'pull_request')
        working-directory: .
        run: pnpm client:smoke
      - name: Exercise calling through the real API, SDK, CLI and fake voice provider
        if: matrix.suite == 'test' && env.SIMULATOR_CHECKS == 'true' && (runner.arch == 'X64' || github.event_name != 'pull_request')
        working-directory: .
        run: node --experimental-strip-types scripts/smoke/calls-api.mjs

      - name: Exercise interactive conference CLI with isolated generated audio
        if: matrix.suite == 'test' && runner.arch == 'X64' && env.SIMULATOR_CHECKS == 'true'
        run: bash scripts/cli-conference-smoke.sh target/debug/wx target/debug/wx-calls-fixture
