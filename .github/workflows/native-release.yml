name: Prepare native release assets
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact @agent-wechat/cli version already committed on main
        required: true
        type: string
      confirm_publish:
        description: Publish tested native release assets (does not deploy or publish npm)
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency: native-release-${{ inputs.version }}
jobs:
  build:
    if: inputs.confirm_publish && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
      - name: Require an unpublished CLI version and exact source tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-release-preflight.mjs
      - name: Validate versioned Changesets notes before building
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --test scripts/native-release-notes.test.mjs
          node scripts/native-release-notes.mjs --output artifacts/release-notes.md
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-wechat/cli build
      - run: pnpm --filter @agent-wechat/agent-wechat... build
      - run: pnpm --filter @agent-wechat/cli test
      - run: bash scripts/native-build-release.sh
      - run: node scripts/native-package-smoke.mjs artifacts/native
      - uses: actions/upload-artifact@v4
        with:
          name: native-release-${{ matrix.arch }}
          path: artifacts/native/*
          if-no-files-found: error
  prepare:
    needs: build
    environment: native-release
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: native-release-*
          path: artifacts/fragments
      - name: Verify and combine independently tested executables
        run: |
          node --test scripts/native-merge-release.test.mjs
          node scripts/native-merge-release.mjs artifacts/native artifacts/fragments/native-release-x64 artifacts/fragments/native-release-arm64
      - name: Render release notes from versioned package changelogs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/native-release-notes.mjs --output artifacts/release-notes.md
      - uses: actions/attest-build-provenance@v4.2.2
        with:
          subject-path: artifacts/native/*
      - name: Publish new assets without replacing existing release files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/native-release-preflight.mjs
          TAG="v$RELEASE_VERSION"
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$GITHUB_SHA" >/dev/null
          fi
          node scripts/native-release-preflight.mjs
          if gh release view "$TAG" --json body --jq .body > artifacts/existing-release-notes.md; then
            node scripts/native-release-notes.mjs --existing artifacts/existing-release-notes.md --output artifacts/release-notes.md
            gh release edit "$TAG" --notes-file artifacts/release-notes.md
          else
            gh release create "$TAG" --verify-tag --target "$GITHUB_SHA" --title "$TAG" --notes-file artifacts/release-notes.md
          fi
          gh release upload "$TAG" artifacts/native/*
