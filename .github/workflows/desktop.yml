name: Desktop app
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      native_artifact_prefix:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ inputs.release && 'release' || 'validation' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
          components: rustfmt
      - run: cargo fmt --check --manifest-path packages/desktop/src-tauri/Cargo.toml

  # One job per platform instead of one matrix: a job can only depend on a whole
  # matrix, so each platform's signing now starts when its own build finishes.
  # Each job is a one-entry matrix so all five share the steps below through a
  # YAML anchor and keep the check name "build (runner, target, platform)".
  #
  # When the caller builds the CLI in this run (native_artifact_prefix), these
  # jobs start alongside it: they compile and test everything that doesn't run
  # the CLI, then wait for their own platform's CLI artifact.
  build-macos-arm64:
    name: build
    strategy:
      matrix:
        include:
          - { runner: macos-latest, target: aarch64-apple-darwin, platform: macos-arm64 }
    runs-on: ${{ matrix.runner }}
    # Includes the wait for this run's CLI build.
    timeout-minutes: &build-timeout 120
    permissions: &build-permissions
      contents: read
      # Lists this run's artifacts while waiting for the CLI.
      actions: read
    env: &build-env
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    defaults: &build-defaults
      run:
        shell: bash
    steps: &build-steps
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        id: rust
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - name: Select the Ubuntu package mirror
        if: runner.os == 'Linux'
        run: |
          # Avoid the Azure mirror's very slow package downloads on x64 runners.
          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources
          fi
      # About 80 MB in 200 packages. Mirror stalls have stretched this from one
      # minute to ten, so main-branch runs cache the files and PRs reuse them.
      - name: Install Linux desktop prerequisites
        if: runner.os == 'Linux'
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libpulse-dev patchelf dbus-x11 gnome-keyring xvfb x11-utils webkit2gtk-driver python3-dbus python3-gi
      - name: Select native Windows compiler
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/msvc.ps1
      - name: Select Windows Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path C:\Strawberry\perl\bin\perl.exe)) { choco install strawberryperl --no-progress -y }
          'C:\Strawberry\perl\bin' | Out-File $env:GITHUB_PATH -Append
      - name: Restore CLI dependencies only for standalone desktop builds
        if: inputs.native_artifact_prefix == ''
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/native-client-rust -> target
          add-rust-environment-hash-key: false
          key: desktop-cli-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ env.VCToolsVersion }}-${{ env.WindowsSDKVersion }}-${{ env.RUSTFLAGS }}
          cache-on-failure: true
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri -> target
          add-rust-environment-hash-key: false
          key: desktop-v3-${{ matrix.runner }}-${{ matrix.target }}-${{ steps.rust.outputs.cachekey }}-${{ env.VCToolsVersion }}-${{ env.WindowsSDKVersion }}-${{ env.RUSTFLAGS }}-debug${{ env.CARGO_PROFILE_DEV_DEBUG }}-${{ env.CARGO_PROFILE_TEST_DEBUG }}
          cache-on-failure: true
          # Native distribution's main-branch runs save this; PRs read it. The
          # standalone CLI cache above keeps saving from PRs: no main run fills it.
          save-if: ${{ github.event_name != 'pull_request' }}
      - run: pnpm install --frozen-lockfile --filter @agent-wechat/desktop...
      - run: pnpm --filter @agent-wechat/desktop build
      - run: pnpm --filter @agent-wechat/shared build
      - name: Build native CLI
        if: inputs.native_artifact_prefix == '' && runner.os != 'Windows'
        run: cargo build --release --locked --manifest-path packages/native-client-rust/Cargo.toml --target ${{ matrix.target }} -p wx-native
      - name: Build Windows native CLI
        if: inputs.native_artifact_prefix == '' && runner.os == 'Windows'
        shell: pwsh
        run: cargo build --release --locked --manifest-path packages/native-client-rust/Cargo.toml --target ${{ matrix.target }} -p wx-native
      - name: Prepare the standalone CLI and media helpers
        if: inputs.native_artifact_prefix == ''
        run: pnpm --filter @agent-wechat/desktop prepare:sidecars --target ${{ matrix.target }}
      # Tauri's build only needs the sidecar file to exist: it copies it into
      # the target folder and compiles nothing from it. Every cargo step runs
      # before the verified CLI replaces this file, because Tauri marks it as a
      # build input and a later cargo step would recompile the app.
      - name: Stand in for the CLI this run is still building
        if: inputs.native_artifact_prefix != ''
        run: |
          node -e "require('node:fs').writeFileSync(process.argv[1], 'Placeholder for the CLI this run is still building\n')" "$RUNNER_TEMP/wx-placeholder"
          pnpm --filter @agent-wechat/desktop prepare:sidecars --target ${{ matrix.target }} --wx "$RUNNER_TEMP/wx-placeholder"
      - name: Build desktop executable
        if: runner.os != 'Windows'
        run: pnpm --filter @agent-wechat/desktop app:build --target ${{ matrix.target }} --no-bundle
      - name: Build Windows desktop executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: pnpm --filter @agent-wechat/desktop app:build --target ${{ matrix.target }} --no-bundle
      - name: Check native desktop code
        if: runner.os != 'Windows'
        run: |
          if [ '${{ matrix.platform }}' = linux-x64 ]; then
            cargo clippy --all-targets --locked --manifest-path packages/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} -- -D warnings
          fi
          cargo test --locked --manifest-path packages/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Check Windows desktop code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo test --locked --manifest-path packages/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }}
      - name: Install the WebDriver bridge for the Linux window check
        if: runner.os == 'Linux'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Wait for this run's ${{ matrix.target }} CLI build
        if: inputs.native_artifact_prefix != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/wait-artifact.mjs "${{ inputs.native_artifact_prefix }}-${{ matrix.target }}"
      - name: Download the CLI already built and validated in this run
        if: inputs.native_artifact_prefix != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.native_artifact_prefix }}-${{ matrix.target }}
          path: ${{ runner.temp }}/native-cli-artifact
      - name: Require matching CLI source, compiler, target, flags and checksum
        if: inputs.native_artifact_prefix != ''
        run: node scripts/ci/artifact.mjs restore "$RUNNER_TEMP/native-cli-artifact"
      # The tests were compiled above and take the CLI from WX_BINARY, so these
      # steps don't rebuild.
      - name: Exercise native hub lifecycle and Linux keyring
        if: runner.os == 'Linux'
        env:
          WX_BINARY: ${{ github.workspace }}/packages/native-client-rust/target/${{ matrix.target }}/release/wx
        run: |
          dbus-run-session -- bash -c 'printf "fixture-password\n" | gnome-keyring-daemon --unlock --components=secrets; cargo test --locked --manifest-path packages/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} -- --ignored'
      - name: Exercise native hub lifecycle and macOS keychain
        if: runner.os == 'macOS'
        env:
          WX_BINARY: ${{ github.workspace }}/packages/native-client-rust/target/${{ matrix.target }}/release/wx
        run: cargo test --locked --manifest-path packages/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} -- --ignored
      - name: Exercise native hub lifecycle and Windows credentials
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WX_BINARY: ${{ github.workspace }}/packages/native-client-rust/target/${{ matrix.target }}/release/wx.exe
        run: cargo test --locked --manifest-path packages/desktop/src-tauri/Cargo.toml --target ${{ matrix.target }} -- --ignored
      # No cargo step follows. Replaces the placeholder in the sidecar folder
      # that packaging reads, and the copy Tauri's build made for the app to
      # run: beside it, or in bin/ on Linux, where the CLI is a resource.
      - name: Put the verified CLI in place of the stand-in
        if: inputs.native_artifact_prefix != ''
        env:
          EXE: ${{ runner.os == 'Windows' && '.exe' || '' }}
        run: |
          pnpm --filter @agent-wechat/desktop prepare:sidecars --target ${{ matrix.target }}
          cli="packages/native-client-rust/target/${{ matrix.target }}/release/wx$EXE"
          beside="packages/desktop/src-tauri/target/${{ matrix.target }}/release/${{ runner.os == 'Linux' && 'bin/' || '' }}wx$EXE"
          cp "$cli" "$beside"
          copies=("$beside" "packages/desktop/src-tauri/binaries/wx-${{ matrix.target }}$EXE")
          if [ '${{ runner.os }}' = Linux ]; then copies+=(packages/desktop/src-tauri/binaries/linux/wx); fi
          for copy in "${copies[@]}"; do
            cmp "$cli" "$copy" || { echo "::error::$copy is not the verified CLI"; exit 1; }
          done
      - name: Verify Linux native window, keyring persistence and restart
        if: runner.os == 'Linux'
        env:
          DESKTOP_BINARY: ${{ github.workspace }}/packages/desktop/src-tauri/target/${{ matrix.target }}/release/agent-wechat
        run: |
          export HOME=$(mktemp -d)
          export XDG_RUNTIME_DIR=$(mktemp -d)
          dbus-run-session -- xvfb-run -a bash -c 'printf "fixture-password\n" | gnome-keyring-daemon --unlock --components=secrets; node packages/desktop/test/webdriver.mjs'
      - name: Set installer identity before any code signing
        if: runner.os != 'macOS'
        run: node packages/desktop/scripts/bundle-type.mjs packages/desktop/src-tauri/target/${{ matrix.target }}/release/agent-wechat${{ runner.os == 'Windows' && '.exe' || '' }} ${{ runner.os == 'Windows' && 'nsis' || 'deb' }}
      - name: Stage desktop bundle inputs
        if: inputs.release
        run: |
          mkdir -p artifacts/desktop-input/packages/desktop/src-tauri/target/${{ matrix.target }}/release
          mkdir -p artifacts/desktop-input/packages/desktop/src-tauri
          cp packages/desktop/src-tauri/target/${{ matrix.target }}/release/agent-wechat${{ runner.os == 'Windows' && '.exe' || '' }} artifacts/desktop-input/packages/desktop/src-tauri/target/${{ matrix.target }}/release/
          cp -R packages/desktop/src-tauri/binaries packages/desktop/src-tauri/resources packages/desktop/src-tauri/sounds artifacts/desktop-input/packages/desktop/src-tauri/
      - uses: actions/upload-artifact@v7
        if: inputs.release
        with:
          name: desktop-input-${{ matrix.platform }}
          path: artifacts/desktop-input/
          if-no-files-found: error
      - name: Build unsigned validation installers
        if: ${{ !inputs.release && github.event_name != 'pull_request' }}
        run: pnpm --filter @agent-wechat/desktop app:bundle --target ${{ matrix.target }} --bundles ${{ runner.os == 'macOS' && 'app' || runner.os == 'Windows' && 'nsis' || 'deb' }}
      - name: Inspect Linux package layout
        if: ${{ !inputs.release && github.event_name != 'pull_request' && runner.os == 'Linux' }}
        run: node packages/desktop/test/validate-deb.mjs packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
      - name: Stage runnable validation downloads
        if: ${{ !inputs.release && github.event_name != 'pull_request' }}
        run: |
          mkdir -p artifacts/desktop-validation
          case "${{ runner.os }}" in
            macOS) ditto -c -k --keepParent packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/AgentWechat.app artifacts/desktop-validation/AgentWechat-macos-arm64-unsigned.zip ;;
            Windows) cp packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe artifacts/desktop-validation/ ;;
            Linux) cp packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb artifacts/desktop-validation/ ;;
          esac
      - uses: actions/upload-artifact@v7
        if: ${{ !inputs.release && github.event_name != 'pull_request' }}
        with:
          name: desktop-validation-${{ matrix.platform }}
          path: artifacts/desktop-validation/
          if-no-files-found: error
      - name: Package Linux release
        if: inputs.release && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        run: |
          pnpm --filter @agent-wechat/desktop app:bundle --target ${{ matrix.target }} --bundles deb
          node packages/desktop/test/validate-deb.mjs packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          mkdir -p artifacts/desktop-release
          cp packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb "artifacts/desktop-release/AgentWechat-v$VERSION-${{ matrix.platform }}.deb"
          node packages/desktop/scripts/sign-updates.mjs artifacts/desktop-release ${{ matrix.platform }}
          node packages/desktop/scripts/manifest.mjs artifacts/desktop-release ${{ matrix.platform }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        if: inputs.release && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        with:
          name: desktop-release-${{ matrix.platform }}
          path: artifacts/desktop-release/
          if-no-files-found: error

  build-windows-x64:
    name: build
    strategy:
      matrix:
        include:
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, platform: windows-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: *build-timeout
    permissions: *build-permissions
    env: *build-env
    defaults: *build-defaults
    steps: *build-steps

  build-linux-x64:
    name: build
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu, platform: linux-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: *build-timeout
    permissions: *build-permissions
    env: *build-env
    defaults: *build-defaults
    steps: *build-steps

  # PRs and Native distribution's main-branch runs cover each OS; releases and
  # manual runs add the two ARM64 platforms. Those main-branch runs only build
  # CLI artifacts for the three platforms above.
  build-windows-arm64:
    name: build
    if: inputs.release || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - { runner: windows-11-arm, target: aarch64-pc-windows-msvc, platform: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: *build-timeout
    permissions: *build-permissions
    env: *build-env
    defaults: *build-defaults
    steps: *build-steps

  build-linux-arm64:
    name: build
    if: inputs.release || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: *build-timeout
    permissions: *build-permissions
    env: *build-env
    defaults: *build-defaults
    steps: *build-steps

  # Windows release packaging, once per architecture so x64 doesn't wait for
  # the ARM64 build or the reverse: sign the executables, package the
  # installer, sign the installer, then sign the updater package.
  sign-windows-binaries-x64:
    needs: build-windows-x64
    if: &trusted-release inputs.release && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && github.event_name != 'pull_request_target'
    permissions: &signing-permissions
      contents: read
      id-token: write
    uses: ./.github/workflows/windows-signing.yml
    with:
      unsigned-artifact: desktop-input-windows-x64
      signed-artifact: desktop-signed-windows-x64

  sign-windows-binaries-arm64:
    needs: build-windows-arm64
    if: *trusted-release
    permissions: *signing-permissions
    uses: ./.github/workflows/windows-signing.yml
    with:
      unsigned-artifact: desktop-input-windows-arm64
      signed-artifact: desktop-signed-windows-arm64

  package-windows-x64:
    name: package-windows
    needs: sign-windows-binaries-x64
    if: *trusted-release
    strategy:
      matrix:
        include:
          - { arch: x64, target: x86_64-pc-windows-msvc }
    runs-on: windows-latest
    steps: &package-windows-steps
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-wechat/shared build
      - run: pnpm --filter @agent-wechat/client-ui build
      - uses: actions/download-artifact@v8
        with:
          name: desktop-signed-windows-${{ matrix.arch }}
          path: .
      - run: pnpm --filter @agent-wechat/desktop app:bundle --target ${{ matrix.target }} --bundles nsis --no-sign
      - name: Require signed application payloads to remain valid after packaging
        shell: pwsh
        run: |
          $files = @(Get-Item 'packages/desktop/src-tauri/target/${{ matrix.target }}/release/agent-wechat.exe')
          $files += @(Get-ChildItem packages/desktop/src-tauri/binaries/*.exe)
          foreach ($file in $files) {
            $signature = Get-AuthenticodeSignature -LiteralPath $file.FullName
            if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
              throw "Packaging invalidated the signature or timestamp for $($file.Name)"
            }
          }
      - shell: bash
        run: |
          mkdir -p artifacts/installers
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          cp packages/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe "artifacts/installers/AgentWechat-v$VERSION-windows-${{ matrix.arch }}-setup.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-installers-unsigned-${{ matrix.arch }}
          path: artifacts/installers/
          if-no-files-found: error

  package-windows-arm64:
    name: package-windows
    needs: sign-windows-binaries-arm64
    if: *trusted-release
    strategy:
      matrix:
        include:
          - { arch: arm64, target: aarch64-pc-windows-msvc }
    runs-on: windows-latest
    steps: *package-windows-steps

  sign-windows-installers-x64:
    needs: package-windows-x64
    if: *trusted-release
    permissions: *signing-permissions
    uses: ./.github/workflows/windows-signing.yml
    with:
      unsigned-artifact: desktop-installers-unsigned-x64
      signed-artifact: desktop-installers-signed-x64

  sign-windows-installers-arm64:
    needs: package-windows-arm64
    if: *trusted-release
    permissions: *signing-permissions
    uses: ./.github/workflows/windows-signing.yml
    with:
      unsigned-artifact: desktop-installers-unsigned-arm64
      signed-artifact: desktop-installers-signed-arm64

  finish-windows-x64:
    name: finish-windows
    needs: sign-windows-installers-x64
    if: *trusted-release
    strategy:
      matrix:
        arch: [x64]
    runs-on: ubuntu-24.04
    steps: &finish-windows-steps
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - run: pnpm install --frozen-lockfile --filter @agent-wechat/desktop...
      - uses: actions/download-artifact@v8
        with:
          name: desktop-installers-signed-${{ matrix.arch }}
          path: artifacts/desktop-release/
      - name: Sign and verify final Windows updater
        run: |
          node packages/desktop/scripts/sign-updates.mjs artifacts/desktop-release windows-${{ matrix.arch }}
          node packages/desktop/scripts/manifest.mjs artifacts/desktop-release windows-${{ matrix.arch }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release-windows-${{ matrix.arch }}
          path: artifacts/desktop-release/
          if-no-files-found: error

  finish-windows-arm64:
    name: finish-windows
    needs: sign-windows-installers-arm64
    if: *trusted-release
    strategy:
      matrix:
        arch: [arm64]
    runs-on: ubuntu-24.04
    steps: *finish-windows-steps

  sign-macos:
    needs: build-macos-arm64
    if: *trusted-release
    runs-on: macos-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @agent-wechat/shared build
      - run: pnpm --filter @agent-wechat/client-ui build
      - uses: actions/download-artifact@v8
        with:
          name: desktop-input-macos-arm64
          path: .
      - name: Import Developer ID certificate into a temporary keychain
        run: bash packages/desktop/scripts/macos-keychain.sh
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: Package and sign nested executables and app
        run: |
          chmod +x packages/desktop/src-tauri/target/aarch64-apple-darwin/release/agent-wechat packages/desktop/src-tauri/binaries/*
          pnpm --filter @agent-wechat/desktop app:bundle --target aarch64-apple-darwin --bundles app
      - name: Notarize, staple and assess final app and DMG
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          bash packages/desktop/scripts/macos-notarize.sh packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/AgentWechat.app artifacts/desktop-release "$VERSION"
          tar -czf "artifacts/desktop-release/AgentWechat-v$VERSION-macos-arm64.app.tar.gz" -C packages/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos AgentWechat.app
          node packages/desktop/scripts/sign-updates.mjs artifacts/desktop-release macos-arm64
          node packages/desktop/scripts/manifest.mjs artifacts/desktop-release macos-arm64
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Remove temporary signing credentials
        if: always()
        run: bash packages/desktop/scripts/macos-cleanup.sh
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-release-macos-arm64
          path: artifacts/desktop-release/
          if-no-files-found: error
