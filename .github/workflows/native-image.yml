name: Publish native runtime image
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact native CLI version already prepared from this main commit
        required: true
        type: string
      confirm_publish:
        description: Publish image only; no host deploy, service restart or profile change
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency: native-image-${{ inputs.version }}
jobs:
  publish:
    if: inputs.confirm_publish && github.ref == 'refs/heads/main'
    environment: native-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require prepared exact-version source assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module -e 'import fs from "node:fs"; if(JSON.parse(fs.readFileSync("packages/cli/package.json")).version!==process.env.RELEASE_VERSION)throw Error("Version mismatch");'
          node scripts/native-prepare-package.mjs
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build and test image before publishing
        run: |
          docker build --platform linux/amd64 -f deploy/native/Dockerfile -t native-candidate .
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges native-candidate --json version
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned native image with provenance
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: deploy/native/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}-native:v${{ inputs.version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: mode=max
          sbom: true
