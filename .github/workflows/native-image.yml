name: Publish native runtime image
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      confirm_publish:
        required: true
        type: boolean
      source_commit:
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Exact native CLI version with published source-verified assets
        required: true
        type: string
      source_commit:
        description: Optional full prepared release commit for image-only recovery
        required: false
        default: ''
        type: string
      confirm_publish:
        description: Publish image only; no host deploy, service restart or profile change
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency: native-image-${{ inputs.version }}
jobs:
  publish:
    if: inputs.confirm_publish && github.ref == 'refs/heads/main'
    environment: native-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_commit || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - name: Install the verified CLI audio runtime dependency
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0
      - name: Require prepared exact-version source assets
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          IMAGE_SOURCE_COMMIT: ${{ inputs.source_commit || github.sha }}
          PUBLISHER_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { prepareNativePackage } from './scripts/native-prepare-package.mjs';
          const source = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (!/^[a-f0-9]{40}$/.test(process.env.IMAGE_SOURCE_COMMIT ?? '') || source !== process.env.IMAGE_SOURCE_COMMIT) {
            throw Error('Image checkout must match the full prepared source commit');
          }
          if (JSON.parse(fs.readFileSync('packages/cli/package.json')).version !== process.env.RELEASE_VERSION) {
            throw Error('Version mismatch');
          }
          const taggedSource = execFileSync('git', ['rev-parse', `refs/tags/v${process.env.RELEASE_VERSION}^{commit}`], { encoding: 'utf8' }).trim();
          if (taggedSource !== source) throw Error('Image source must match the published version tag');
          execFileSync('git', ['merge-base', '--is-ancestor', source, process.env.PUBLISHER_SOURCE_COMMIT]);
          await prepareNativePackage({ sourceCommit: source });
          NODE
      - uses: docker/setup-buildx-action@v4.4.1
        id: buildx
      - name: Build the native image candidate
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/native/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: native-candidate
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_commit || github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          cache-from: type=gha,scope=native-linux-${{ runner.arch }}
      - name: Build and test on the native architecture before publishing
        run: |
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges native-candidate --json version
          python3 scripts/native-container-smoke.py native-candidate
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested architecture by digest
        id: image
        uses: docker/build-push-action@v7.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          context: .
          file: deploy/native/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}-native,push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.revision=${{ inputs.source_commit || github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=native-linux-${{ runner.arch }}
          cache-to: type=gha,mode=max,scope=native-linux-${{ runner.arch }}
      - name: Record digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          mkdir -p artifacts/digests
          touch "artifacts/digests/${IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        with:
          name: native-image-${{ matrix.arch }}
          path: artifacts/digests/*
          if-no-files-found: error
  manifest:
    needs: publish
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: native-image-*
          path: artifacts/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned multi-architecture image
        env:
          IMAGE: ghcr.io/${{ github.repository }}-native
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          refs=()
          for digest in artifacts/digests/*; do refs+=("$IMAGE@sha256:${digest##*/}"); done
          test "${#refs[@]}" = 2
          tags=(--tag "$IMAGE:v$RELEASE_VERSION")
          # Stable versions also move `latest`; prereleases (1.0.0-beta.N) never do.
          if [[ "$RELEASE_VERSION" != *-* ]]; then tags+=(--tag "$IMAGE:latest"); fi
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"
